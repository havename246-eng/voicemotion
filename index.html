<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta name="description" content="Record or upload your voice and watch it move a living gradient. Export it as an MP4." />
  <title>VoiceMotion</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Sharp:opsz,wght,FILL,GRAD@24,500,0..1,0&icon_names=check_box,check_box_outline_blank,download,mic,palette,pause,play_arrow,stop,upload&display=block" rel="stylesheet" />
  <style>
    :root {
      --s: 40px;
      --m: 56px;
      --l: 72px;
      --xl: 96px;
      --white: #ffffff;
      --black: #000000;
      --ease: cubic-bezier(.2, .8, .2, 1);
    }
    @media (max-height: 640px) {
      :root { --m: 48px; --l: 60px; --xl: 80px; --s: 36px; }
    }
    @media (max-height: 500px) {
      :root { --m: 42px; --l: 52px; --xl: 68px; --s: 34px; }
    }

    * { box-sizing: border-box; margin: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--black);
      color: var(--white);
      font-family: "Google Sans", system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
      overscroll-behavior: none;
    }

    #bg {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      display: block;
    }

    .app {
      position: relative;
      z-index: 1;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: max(12px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
    }

    nav {
      flex: none;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .wordmark {
      display: block;
      height: 44px;
      width: auto;
      user-select: none;
      -webkit-user-drag: none;
    }

    .stage {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(18px, 5vh, 48px);
    }

    /* ---------- Circular buttons ---------- */
    .btn {
      flex: none;
      display: inline-grid;
      place-items: center;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: var(--white);
      color: var(--black);
      font: 600 0.8rem/1 "Google Sans", system-ui, sans-serif;
      cursor: pointer;
      transition: transform .18s var(--ease), opacity .2s, box-shadow .2s;
      -webkit-tap-highlight-color: transparent;
    }
    .btn:hover { transform: scale(1.05); }
    .btn:active { transform: scale(0.95); }
    .btn:focus-visible { outline: 2px solid var(--white); outline-offset: 4px; }
    .btn:disabled { opacity: .35; cursor: default; transform: none; }
    /* Material Symbols Sharp */
    .icon {
      display: block;
      font-family: "Material Symbols Sharp";
      font-weight: normal;
      font-style: normal;
      line-height: 1;
      letter-spacing: normal;
      white-space: nowrap;
      font-feature-settings: "liga";
      font-variation-settings: "FILL" 0, "wght" 500, "GRAD" 0, "opsz" 24;
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }
    .icon.fill { font-variation-settings: "FILL" 1, "wght" 500, "GRAD" 0, "opsz" 24; }
    .s .icon { font-size: calc(var(--s) * .55); }
    .m .icon { font-size: calc(var(--m) * .46); }
    .xl .icon { font-size: calc(var(--xl) * .4); }
    .s { width: var(--s); height: var(--s); }
    .m { width: var(--m); height: var(--m); }
    .l { width: var(--l); height: var(--l); }
    .xl { width: var(--xl); height: var(--xl); }

    /* ---------- Mic ---------- */
    .mic-block { display: flex; flex-direction: column; align-items: center; gap: 14px; }
    .mic-wrap {
      position: relative;
      width: var(--xl);
      height: var(--xl);
      display: grid;
      place-items: center;
    }
    #ring {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 240%;
      height: 240%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }
    .pulse {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, .75);
      opacity: 0;
      pointer-events: none;
    }
    .recording .pulse { animation: pulse 1.8s ease-out infinite; }
    .recording .pulse.p2 { animation-delay: .9s; }
    @keyframes pulse {
      from { transform: scale(1); opacity: .7; }
      to { transform: scale(1.8); opacity: 0; }
    }
    #micBtn { position: relative; z-index: 1; }
    #micBtn .i-stop { display: none; }
    .recording #micBtn .i-mic { display: none; }
    .recording #micBtn .i-stop { display: block; }

    .timer {
      height: 1.25em;
      font-size: .95rem;
      font-weight: 500;
      font-variant-numeric: tabular-nums;
      letter-spacing: .01em;
      opacity: .9;
    }

    /* ---------- Pill buttons ---------- */
    .pill {
      position: relative;
      overflow: hidden;
      flex: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      height: var(--m);
      padding: 0 24px 0 20px;
      border: 0;
      border-radius: 999px;
      background: var(--white);
      color: var(--black);
      font: 600 .95rem/1 "Google Sans", system-ui, sans-serif;
      white-space: nowrap;
      cursor: pointer;
      transition: transform .18s var(--ease), opacity .2s, background-color .2s, color .2s;
      -webkit-tap-highlight-color: transparent;
    }
    .pill .icon { font-size: 22px; }
    .pill:hover { transform: scale(1.04); }
    .pill:active { transform: scale(0.96); }
    .pill:focus-visible { outline: 2px solid var(--white); outline-offset: 4px; }
    .pill:disabled { opacity: .35; cursor: default; transform: none; }
    .pill.compact { height: 46px; padding: 0 18px 0 14px; gap: 6px; font-size: .875rem; }
    .pill.compact .icon { font-size: 20px; }

    /* ---------- Upload ---------- */
    /* Damped bounce: lift, drop, then smaller rebounds that settle */
    .upload.nudge { animation: nudge 1.4s cubic-bezier(.37, 0, .63, 1) 1; }
    @keyframes nudge {
      0%   { transform: translateY(0) scale(1); }
      18%  { transform: translateY(-14px) scale(1.06); }
      36%  { transform: translateY(0) scale(1.02, .97); }
      50%  { transform: translateY(-7px) scale(1.03); }
      64%  { transform: translateY(0) scale(1.01, .99); }
      76%  { transform: translateY(-3px) scale(1.01); }
      88%  { transform: translateY(0) scale(1); }
      100% { transform: translateY(0) scale(1); }
    }

    /* ---------- Message ---------- */
    .msg {
      max-width: 360px;
      padding: 10px 16px;
      border-radius: 14px;
      background: rgba(0, 0, 0, .55);
      -webkit-backdrop-filter: blur(12px);
      backdrop-filter: blur(12px);
      font-size: .875rem;
      line-height: 1.45;
      text-align: center;
    }
    .msg[hidden] { display: none; }

    /* ---------- Export panel ---------- */
    .export {
      flex: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      transition: opacity .35s var(--ease), transform .35s var(--ease);
    }
    .export[hidden] { display: none; }
    .export.enter { opacity: 0; transform: translateY(12px); }
    .row { display: flex; align-items: flex-start; justify-content: center; gap: 12px; }
    .row[role="radiogroup"] { margin-bottom: 8px; }
    /* Bottom row: copyright left, palette button right. It's part of the page
       flow so it can never overlap the export controls on small screens. */
    .foot {
      flex: none;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 12px;
      padding: 0 env(safe-area-inset-right) 0 env(safe-area-inset-left);
    }
    .copyright { font-size: .8rem; opacity: .7; }
    .color-btn[aria-expanded="true"] { box-shadow: 0 0 0 3px rgba(255, 255, 255, .35); }

    /* ---------- Color panel ---------- */
    .color-panel {
      position: fixed;
      right: max(16px, env(safe-area-inset-right));
      bottom: calc(max(16px, env(safe-area-inset-bottom)) + var(--m) + 12px);
      z-index: 3;
      width: min(280px, calc(100vw - 32px));
      max-height: calc(100dvh - var(--m) - 64px);
      overflow-y: auto;
      padding: 16px;
      border-radius: 18px;
      background: rgba(0, 0, 0, .6);
      -webkit-backdrop-filter: blur(16px);
      backdrop-filter: blur(16px);
      display: flex;
      flex-direction: column;
      gap: 12px;
      transform-origin: bottom right;
      transition: opacity .2s var(--ease), transform .2s var(--ease);
    }
    .color-panel[hidden] { display: none; }
    .color-panel.enter { opacity: 0; transform: translateY(8px) scale(.97); }
    .color-panel h2 { font-size: .8rem; font-weight: 600; letter-spacing: .02em; opacity: .75; }
    .presets { display: flex; gap: 10px; }
    .preset {
      width: 32px;
      height: 32px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      cursor: pointer;
      transition: transform .18s var(--ease);
    }
    .preset:hover { transform: scale(1.08); }
    .preset:focus-visible { outline: 2px solid var(--white); outline-offset: 3px; }
    #colorRows { display: flex; flex-direction: column; gap: 8px; }
    .color-row { display: flex; align-items: center; gap: 10px; }
    .color-row label { flex: 1; font-size: .875rem; }
    .color-row input[type="color"] {
      flex: none;
      width: 32px;
      height: 32px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: none;
      cursor: pointer;
    }
    .color-row input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
    .color-row input[type="color"]::-webkit-color-swatch { border: 1.5px solid rgba(255, 255, 255, .5); border-radius: 50%; }
    .color-row input[type="color"]::-moz-color-swatch { border: 1.5px solid rgba(255, 255, 255, .5); border-radius: 50%; }
    .hex {
      flex: none;
      width: 92px;
      height: 34px;
      padding: 0 10px;
      border: 1.5px solid rgba(255, 255, 255, .3);
      border-radius: 10px;
      background: rgba(255, 255, 255, .08);
      color: var(--white);
      font: 500 1rem/1 "Google Sans", system-ui, sans-serif; /* 16px stops iOS zooming on focus */
      font-variant-numeric: tabular-nums;
      text-transform: uppercase;
    }
    .hex:focus { outline: none; border-color: var(--white); }
    .hex[aria-invalid="true"] { border-color: #ff7a7a; }
    .reset {
      align-self: flex-start;
      padding: 0;
      border: 0;
      background: none;
      color: var(--white);
      font: 500 .8rem/1 "Google Sans", system-ui, sans-serif;
      opacity: .75;
      text-decoration: underline;
      text-underline-offset: 3px;
      cursor: pointer;
    }
    .reset:hover { opacity: 1; }
    .chip { opacity: .55; }
    .chip[aria-checked="true"] { opacity: 1; box-shadow: 0 0 0 3px rgba(255, 255, 255, .35); }
    .caption { font-size: .8rem; opacity: .75; height: 1.2em; }
    .row.actions { flex-wrap: wrap; align-items: center; gap: 10px; }
    .pill > span { position: relative; }

    #wmBtn .i-off { display: none; }
    #wmBtn[aria-pressed="false"] { background: rgba(255, 255, 255, .14); color: var(--white); box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, .6); }
    #wmBtn[aria-pressed="false"] .i-on { display: none; }
    #wmBtn[aria-pressed="false"] .i-off { display: block; }

    /* Export progress fills the pill from the left */
    #exportBtn .bar {
      position: absolute;
      inset: 0;
      width: calc(var(--p, 0) * 1%);
      background: rgba(0, 0, 0, .14);
      opacity: 0;
      transition: width .2s linear, opacity .2s;
    }
    .exporting #exportBtn .bar { opacity: 1; }
    .exporting #exportBtn:disabled { opacity: 1; }
    #exportBtn .pct { display: none; font-variant-numeric: tabular-nums; }
    .exporting #exportBtn .pct { display: inline; }
    .exporting #exportBtn .label { display: none; }

    #playBtn .i-pause, #playBtn .t-pause { display: none; }
    .playing #playBtn .i-pause { display: block; }
    .playing #playBtn .t-pause { display: inline; }
    .playing #playBtn .i-play, .playing #playBtn .t-play { display: none; }
    .status { font-size: .8rem; opacity: .8; min-height: 1.2em; text-align: center; }

    @media (max-height: 560px) {
      .caption { display: none; }
      .export { gap: 8px; }
    }

    /* ---------- Phones ---------- */
    @media (max-width: 440px) {
      .row { gap: 10px; }
      .row.actions { flex-wrap: nowrap; gap: 6px; }
      .pill.compact { height: 42px; padding: 0 12px 0 9px; gap: 4px; font-size: .8rem; }
      .pill.compact .icon { font-size: 18px; }
      .wordmark { height: 38px; }
      nav { height: 52px; }
    }

    /* Phone in landscape: no room for a footer row, so pin it to the corners */
    @media (max-height: 500px) and (min-width: 560px) {
      nav { height: 40px; }
      .wordmark { height: 30px; }
      .foot {
        position: fixed;
        left: 0;
        right: 0;
        bottom: max(12px, env(safe-area-inset-bottom));
        width: auto;
        margin: 0;
        padding: 0 max(16px, env(safe-area-inset-right)) 0 max(16px, env(safe-area-inset-left));
        pointer-events: none;
      }
      .foot .btn { pointer-events: auto; }
    }

    /* ---------- Tablets: bigger controls to fill the space ---------- */
    @media (min-width: 700px) and (min-height: 900px) {
      :root { --s: 44px; --m: 64px; --l: 80px; --xl: 120px; }
      .pill { height: 60px; font-size: 1.05rem; padding: 0 28px 0 24px; }
      .pill.compact { height: 52px; padding: 0 22px 0 18px; font-size: .95rem; }
      .pill.compact .icon { font-size: 22px; }
      .row { gap: 14px; }
      .caption, .status, .copyright { font-size: .9rem; }
      .wordmark { height: 52px; }
      nav { height: 72px; }
    }

    /* Touch screens: no sticky hover zoom, no double-tap zoom delay */
    @media (hover: none) {
      .btn:hover, .pill:hover, .preset:hover { transform: none; }
      .btn:active, .pill:active { transform: scale(0.94); }
    }
    button { touch-action: manipulation; }

    /* ---------- Video details sheet ---------- */
    .sheet-backdrop {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: rgba(0, 0, 0, .55);
      -webkit-backdrop-filter: blur(8px);
      backdrop-filter: blur(8px);
    }
    .sheet-backdrop[hidden] { display: none; }
    .sheet {
      width: min(480px, 100%);
      max-height: calc(100dvh - 32px);
      overflow-y: auto;
      overscroll-behavior: contain;
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding: 20px;
      border-radius: 22px;
      background: #141414;
      box-shadow: 0 20px 60px rgba(0, 0, 0, .5);
      outline: none;
    }
    .sheet-head h2 { font-size: 1.15rem; font-weight: 600; }
    .sheet-head p { margin-top: 4px; font-size: .85rem; line-height: 1.4; opacity: .65; }
    .sheet-preview {
      display: block;
      align-self: center;
      max-width: 100%;
      max-height: min(30dvh, 240px);
      width: auto;
      height: auto;
      border-radius: 10px;
      background: #000;
      box-shadow: 0 0 0 1px rgba(255, 255, 255, .12);
    }
    .field { display: flex; flex-direction: column; gap: 6px; min-width: 0; flex: 1; }
    .field > span { font-size: .8rem; font-weight: 500; opacity: .75; }
    .field input {
      width: 100%;
      height: 44px;
      padding: 0 12px;
      border: 1.5px solid rgba(255, 255, 255, .18);
      border-radius: 12px;
      background: rgba(255, 255, 255, .06);
      color: var(--white);
      font: 400 1rem/1 "Google Sans", system-ui, sans-serif; /* 16px: no iOS zoom */
    }
    .field input::placeholder { color: rgba(255, 255, 255, .35); }
    .field input:focus { outline: none; border-color: var(--white); }
    .field-row { display: flex; gap: 12px; }
    .logo-row { display: flex; align-items: center; gap: 12px; }
    .logo-thumb {
      width: 44px;
      height: 44px;
      object-fit: contain;
      border-radius: 10px;
      background: rgba(255, 255, 255, .08);
    }
    .pill.ghost {
      background: transparent;
      color: var(--white);
      box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, .45);
    }
    .sheet-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 4px; }
    .sheet-actions .spacer { flex: 1; }

    /* Phones: the sheet slides up from the bottom edge */
    @media (max-width: 560px) {
      .sheet-backdrop { align-items: flex-end; padding: 0; }
      .sheet {
        width: 100%;
        max-height: 92dvh;
        border-radius: 22px 22px 0 0;
        padding: 18px 16px max(16px, env(safe-area-inset-bottom));
      }
      .sheet-actions .pill.compact { height: 44px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .recording .pulse { animation: none; opacity: .5; }
      .upload.nudge { animation: none; }
      .btn, .pill, .export, #exportBtn .bar { transition: none; }
    }
  </style>
</head>
<body>
  <canvas id="bg" aria-hidden="true"></canvas>

  <div class="app" id="app">
    <nav><img class="wordmark" src="white-voice-motion.svg" alt="VoiceMotion" /></nav>

    <main class="stage">
      <div class="mic-block">
        <div class="mic-wrap">
          <canvas id="ring" aria-hidden="true"></canvas>
          <span class="pulse"></span>
          <span class="pulse p2"></span>
          <button class="btn xl" id="micBtn" aria-label="Start recording">
            <span class="icon fill i-mic" aria-hidden="true">mic</span>
            <span class="icon fill i-stop" aria-hidden="true">stop</span>
          </button>
        </div>
        <div class="timer" id="timer" aria-live="off"></div>
      </div>

      <button class="pill upload" id="uploadBtn" type="button">
        <span class="icon" aria-hidden="true">upload</span>
        Upload your Voice
      </button>
      <input type="file" id="fileInput" accept=".mp3,.wav,.m4a,.webm,audio/mpeg,audio/wav,audio/x-wav,audio/mp4,audio/x-m4a,audio/webm" hidden />

      <p class="msg" id="msg" role="alert" hidden></p>
    </main>

    <section class="export enter" id="exportPanel" hidden aria-label="Export video">
      <div class="row" role="radiogroup" aria-label="Video size">
        <button class="btn m chip" role="radio" aria-checked="true" data-w="1080" data-h="1080" data-name="Square">1:1</button>
        <button class="btn m chip" role="radio" aria-checked="false" data-w="1080" data-h="1350" data-name="Portrait">4:5</button>
        <button class="btn m chip" role="radio" aria-checked="false" data-w="1080" data-h="1920" data-name="Story / Reels / TikTok">9:16</button>
        <button class="btn m chip" role="radio" aria-checked="false" data-w="1920" data-h="1080" data-name="Landscape">16:9</button>
      </div>
      <p class="caption" id="caption"></p>
      <div class="row actions">
        <button class="pill compact" id="playBtn" type="button">
          <span class="icon fill i-play" aria-hidden="true">play_arrow</span>
          <span class="icon fill i-pause" aria-hidden="true">pause</span>
          <span class="t-play">Preview</span>
          <span class="t-pause">Pause</span>
        </button>
        <button class="pill compact" id="exportBtn" type="button">
          <span class="bar" id="progressBar" aria-hidden="true"></span>
          <span class="icon" aria-hidden="true">download</span>
          <span class="label">Export MP4</span>
          <span class="pct" id="pct">Exporting 0%</span>
        </button>
        <button class="pill compact" id="wmBtn" type="button" aria-pressed="true">
          <span class="icon fill i-on" aria-hidden="true">check_box</span>
          <span class="icon i-off" aria-hidden="true">check_box_outline_blank</span>
          <span>Watermark</span>
        </button>
      </div>
      <p class="status" id="status" aria-live="polite"></p>
    </section>

    <footer class="foot">
      <p class="copyright">Copyright © 2026</p>
      <button class="btn m color-btn" id="colorBtn" type="button" aria-label="Color configuration" title="Color configuration" aria-expanded="false" aria-controls="colorPanel">
        <span class="icon fill" aria-hidden="true">palette</span>
      </button>
    </footer>

    <div class="color-panel enter" id="colorPanel" role="dialog" aria-label="Color configuration" hidden>
      <h2>Presets</h2>
      <div class="presets" id="presets"></div>
      <h2>Colors</h2>
      <div id="colorRows"></div>
      <button class="reset" id="resetColors" type="button">Reset to default</button>
    </div>
  </div>

  <!-- Optional podcast details: filled in → podcast layout, left empty → plain export -->
  <div class="sheet-backdrop" id="detailsSheet" hidden>
    <form class="sheet" id="detailsForm" role="dialog" aria-modal="true" aria-labelledby="detailsTitle" tabindex="-1" autocomplete="off">
      <div class="sheet-head">
        <h2 id="detailsTitle">Video details</h2>
        <p>Optional. Leave everything empty to export the animated video as usual.</p>
      </div>
      <canvas class="sheet-preview" id="detailsPreview" aria-label="Video preview"></canvas>
      <label class="field">
        <span>Headline / topic</span>
        <input name="topic" maxlength="90" placeholder="Does AI replace human?" />
      </label>
      <div class="field-row">
        <label class="field">
          <span>Podcast or episode</span>
          <input name="podcast" maxlength="48" placeholder="Tech Talk · Ep. 12" />
        </label>
        <label class="field">
          <span>Podcaster name</span>
          <input name="person" maxlength="48" placeholder="Sokha Chan" />
        </label>
      </div>
      <div class="field-row">
        <label class="field">
          <span>City</span>
          <input name="city" maxlength="32" placeholder="Phnom Penh" />
        </label>
        <label class="field">
          <span>Country</span>
          <input name="country" maxlength="32" placeholder="Cambodia" />
        </label>
      </div>
      <div class="field">
        <span>Podcaster logo</span>
        <div class="logo-row">
          <img class="logo-thumb" id="logoThumb" alt="" hidden />
          <button class="pill compact ghost" id="logoPick" type="button">
            <span class="icon" aria-hidden="true">upload</span>
            <span id="logoPickText">Upload logo</span>
          </button>
          <button class="reset" id="logoClear" type="button" hidden>Remove</button>
        </div>
        <input type="file" id="logoInput" accept="image/png,image/jpeg,image/webp,image/svg+xml" hidden />
      </div>
      <div class="sheet-actions">
        <button class="reset" id="detailsClear" type="button">Clear all</button>
        <span class="spacer"></span>
        <button class="pill compact ghost" id="detailsCancel" type="button">Cancel</button>
        <button class="pill compact" type="submit">
          <span class="icon" aria-hidden="true">download</span>
          Export MP4
        </button>
      </div>
    </form>
  </div>

  <script>
    "use strict";

    const $ = (s) => document.querySelector(s);
    const app = $("#app");
    const bg = $("#bg");
    const bgCtx = bg.getContext("2d");
    const ring = $("#ring");
    const ringCtx = ring.getContext("2d");
    const micBtn = $("#micBtn");
    const uploadBtn = $("#uploadBtn");
    const fileInput = $("#fileInput");
    const timerEl = $("#timer");
    const msgEl = $("#msg");
    const exportPanel = $("#exportPanel");
    const playBtn = $("#playBtn");
    const exportBtn = $("#exportBtn");
    const wmBtn = $("#wmBtn");
    const captionEl = $("#caption");
    const statusEl = $("#status");
    const pctEl = $("#pct");

    const MAX_SECONDS = 60;
    const EXPORT_FPS = 60;
    const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
    const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));

    // =====================================================================
    // Gradient mesh renderer
    // Soft blobs are drawn into a small buffer and upscaled, which gives the
    // blur for free and keeps both the live view and the export at 60fps.
    // =====================================================================
    const BLOBS = [
      // bright teal glow, top-centre — driven by low frequencies
      { h: 173, s: 72, l: 50, a: 0.95, x: 0.5, y: 0.02, r: 0.62, ax: 0.16, ay: 0.12, fx: 0.31, fy: 0.23, px: 0.0, py: 1.3, band: "low" },
      // deep ocean blue, right side — driven by mids
      { h: 207, s: 62, l: 30, a: 0.9, x: 0.96, y: 0.36, r: 0.5, ax: 0.1, ay: 0.16, fx: 0.19, fy: 0.27, px: 2.1, py: 0.4, band: "mid" },
      // electric cyan, bottom-right — driven by highs
      { h: 193, s: 92, l: 56, a: 0.95, x: 1.0, y: 1.0, r: 0.46, ax: 0.14, ay: 0.1, fx: 0.24, fy: 0.35, px: 4.0, py: 2.7, band: "high" },
      // dark sea green, centre-left — driven by overall volume
      { h: 166, s: 58, l: 22, a: 0.8, x: 0.34, y: 0.42, r: 0.42, ax: 0.18, ay: 0.14, fx: 0.27, fy: 0.17, px: 1.1, py: 3.4, band: "level" },
    ];
    const BLOB_LABELS = ["Glow", "Deep", "Accent", "Shadow"];
    const DEFAULT_COLORS = BLOBS.map((b) => hslToHex(b.h, b.s, b.l));
    // Presets are the default colors rotated around the hue wheel
    const PRESETS = [
      { name: "Ocean", shift: 0 },
      { name: "Violet", shift: 90 },
      { name: "Sunset", shift: 170 },
      { name: "Forest", shift: -55 },
      { name: "Magenta", shift: 142 }, // matches the podcast design's magenta rhythm
    ].map((p) => ({ name: p.name, colors: BLOBS.map((b) => hslToHex((b.h + p.shift + 360) % 360, b.s, b.l)) }));

    function setBlobColor(i, hex) {
      Object.assign(BLOBS[i], hexToHsl(hex));
    }

    // Rhythm colors follow the Color configuration: the top of the wave and the
    // podcast band use "Glow", the bottom of the wave uses "Deep". Lightness is
    // fixed per layer so any picked color still glows; greys/white stay grey.
    const rgbOf = (h, s, l) => {
      const n = parseInt(hslToHex(((h % 360) + 360) % 360, s, l).slice(1), 16);
      return `${n >> 16}, ${(n >> 8) & 255}, ${n & 255}`;
    };
    let rhythmCache = null;
    function rhythmPalette() {
      const a = BLOBS[0], b = BLOBS[1];
      const key = `${a.h},${a.s},${b.h},${b.s}`;
      if (rhythmCache?.key === key) return rhythmCache;
      const sat = (s, min) => (s < 10 ? s : Math.max(s, min));
      const sa = sat(a.s, 75), sb = sat(b.s, 75);
      rhythmCache = {
        key,
        upCore: `rgba(${rgbOf(a.h, sa, 88)}, 1)`,
        upMid: `rgba(${rgbOf(a.h, sa, 62)}, 0.95)`,
        upDeep: `rgba(${rgbOf(a.h - 12, sa, 48)}, 0.5)`,
        upTip: `rgba(${rgbOf(a.h - 20, sa, 35)}, 0)`,
        downCore: `rgba(${rgbOf(b.h, sb, 88)}, 1)`,
        downMid: `rgba(${rgbOf(b.h, sb, 62)}, 0.65)`,
        downEnd: `rgba(${rgbOf(b.h, sb, 45)}, 0)`,
        glow: `rgba(${rgbOf(a.h, sa, 62)}, 0.8)`,
        band: rgbOf(a.h, sat(a.s, 90), 54), // "r, g, b" for the podcast band
      };
      return rhythmCache;
    }

    // ---------- Color helpers (blobs store HSL; the panel edits hex) ----------
    function hslToHex(h, s, l) {
      s /= 100; l /= 100;
      const k = (n) => (n + h / 30) % 12;
      const a = s * Math.min(l, 1 - l);
      const f = (n) => l - a * Math.max(-1, Math.min(k(n) - 3, 9 - k(n), 1));
      return "#" + [f(0), f(8), f(4)].map((v) => Math.round(v * 255).toString(16).padStart(2, "0")).join("");
    }
    function hexToHsl(hex) {
      const n = parseInt(hex.slice(1), 16);
      const r = (n >> 16) / 255, g = ((n >> 8) & 255) / 255, b = (n & 255) / 255;
      const max = Math.max(r, g, b), min = Math.min(r, g, b), d = max - min;
      const l = (max + min) / 2;
      const s = d === 0 ? 0 : d / (1 - Math.abs(2 * l - 1));
      let h = 0;
      if (d) h = max === r ? ((g - b) / d) % 6 : max === g ? (b - r) / d + 2 : (r - g) / d + 4;
      return { h: (h * 60 + 360) % 360, s: s * 100, l: l * 100 };
    }
    // "#abc" or "abc123" -> "#aabbcc"; null when not a valid hex color
    function normalizeHex(v) {
      v = v.trim().replace(/^#/, "");
      if (/^[0-9a-f]{3}$/i.test(v)) v = v.replace(/./g, "$&$&");
      return /^[0-9a-f]{6}$/i.test(v) ? "#" + v.toLowerCase() : null;
    }

    const grain = (() => {
      const c = document.createElement("canvas");
      c.width = c.height = 192;
      const g = c.getContext("2d");
      const img = g.createImageData(c.width, c.height);
      for (let i = 0; i < img.data.length; i += 4) {
        const v = Math.random() * 255;
        img.data[i] = img.data[i + 1] = img.data[i + 2] = v;
        img.data[i + 3] = 255;
      }
      g.putImageData(img, 0, 0);
      return c;
    })();

    class Visual {
      constructor() {
        this.t = Math.random() * 50;
        this.level = this.low = this.mid = this.high = 0;
        this.freq = null;
        this.time = null;
        this.speed = 0;
        this.buf = document.createElement("canvas");
        this.bctx = this.buf.getContext("2d");
        this.soft = document.createElement("canvas");
        this.sctx = this.soft.getContext("2d");
        this.canBlur = "filter" in this.sctx;
        this.patterns = new WeakMap();
      }

      // Read the analyser and ease every value so motion stays fluid.
      update(analyser, dt) {
        let tl = 0, tm = 0, th = 0, tv = 0;
        if (analyser) {
          if (!this.freq || this.freq.length !== analyser.frequencyBinCount) {
            this.freq = new Uint8Array(analyser.frequencyBinCount);
            this.time = new Uint8Array(analyser.fftSize);
          }
          analyser.getByteFrequencyData(this.freq);
          analyser.getByteTimeDomainData(this.time);
          const hz = analyser.context.sampleRate / analyser.fftSize;
          const band = (from, to) => {
            let sum = 0, n = 0;
            const end = Math.min(this.freq.length - 1, Math.ceil(to / hz));
            for (let i = Math.max(1, Math.floor(from / hz)); i <= end; i++) { sum += this.freq[i]; n++; }
            return n ? sum / n / 255 : 0;
          };
          tl = clamp((band(30, 250) - 0.12) / 0.6);
          tm = clamp((band(250, 2000) - 0.1) / 0.55);
          th = clamp((band(2000, 8000) - 0.05) / 0.45);
          let sq = 0;
          for (let i = 0; i < this.time.length; i++) { const d = (this.time[i] - 128) / 128; sq += d * d; }
          tv = clamp(Math.sqrt(sq / this.time.length) * 5);
        } else if (this.freq) {
          this.freq.fill(0);
        }
        const ease = (cur, target, up = 0.09, down = 0.035) => {
          const rate = target > cur ? up : down; // gentle attack, slower release
          return cur + (target - cur) * (1 - Math.pow(1 - rate, dt * 60));
        };
        this.level = ease(this.level, tv);
        this.low = ease(this.low, tl);
        this.mid = ease(this.mid, tm);
        this.high = ease(this.high, th);

        // Ease the flow speed separately so the drift never lurches.
        const base = reducedMotion ? 0.12 : 0.3;
        const targetSpeed = base + this.level * (reducedMotion ? 0.3 : 1.2);
        this.speed = ease(this.speed || base, targetSpeed, 0.05, 0.03);
        this.t += dt * this.speed;
      }

      draw(ctx, w, h) {
        const scale = 0.22;
        const bw = Math.max(48, Math.round(w * scale));
        const bh = Math.max(48, Math.round(h * scale));
        if (this.buf.width !== bw || this.buf.height !== bh) { this.buf.width = bw; this.buf.height = bh; }

        const b = this.bctx;
        b.globalCompositeOperation = "source-over";
        b.fillStyle = "#000";
        b.fillRect(0, 0, bw, bh);
        b.globalCompositeOperation = "screen";

        const t = this.t;
        const m = Math.max(bw, bh);
        const hueShift = Math.sin(t * 0.13) * 12 + this.high * 14;
        for (const blob of BLOBS) {
          const amp = this[blob.band];
          const x = (blob.x + Math.sin(t * blob.fx + blob.px) * blob.ax * (1 + this.level * 0.6)) * bw;
          const y = (blob.y + Math.cos(t * blob.fy + blob.py) * blob.ay * (1 + this.level * 0.6)) * bh;
          const r = blob.r * m * (1 + amp * 0.4 + this.level * 0.14 + Math.sin(t * 0.5 + blob.px) * 0.04);
          const hue = blob.h + hueShift + Math.sin(t * 0.2 + blob.py) * 6;
          const light = Math.min(78, blob.l + amp * 18 + this.level * 7);
          const alpha = Math.min(1, blob.a * (0.85 + amp * 0.3));
          // Smooth (1 - d²)² falloff over several stops, so blobs have no visible edge.
          const g = b.createRadialGradient(x, y, 0, x, y, r);
          for (let i = 0; i <= 8; i++) {
            const d = i / 8;
            const f = (1 - d * d) ** 2;
            g.addColorStop(d, `hsla(${hue}, ${blob.s}%, ${light * (0.6 + 0.4 * f)}%, ${alpha * f})`);
          }
          b.fillStyle = g;
          b.fillRect(0, 0, bw, bh);
        }

        // Extra blur pass at low resolution (cheap) removes upscaling artefacts.
        let src = this.buf;
        if (this.canBlur) {
          const s = this.sctx;
          if (this.soft.width !== bw || this.soft.height !== bh) { this.soft.width = bw; this.soft.height = bh; }
          s.filter = `blur(${Math.max(2, m * 0.03).toFixed(1)}px)`;
          s.drawImage(this.buf, 0, 0);
          s.filter = "none";
          src = this.soft;
        }

        ctx.save();
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = "high";
        ctx.drawImage(src, 0, 0, w, h);

        // Moving film grain hides gradient banding (on screen and in the MP4).
        let pattern = this.patterns.get(ctx);
        if (!pattern) { pattern = ctx.createPattern(grain, "repeat"); this.patterns.set(ctx, pattern); }
        if (pattern.setTransform) {
          pattern.setTransform(new DOMMatrix().translate((Math.random() * 192) | 0, (Math.random() * 192) | 0));
        }
        ctx.globalCompositeOperation = "overlay";
        ctx.globalAlpha = 0.035;
        ctx.fillStyle = pattern;
        ctx.fillRect(0, 0, w, h);
        ctx.restore();
      }
    }

    const live = new Visual();

    // =====================================================================
    // Audio graph
    // =====================================================================
    let audioCtx = null;
    let analyser = null;

    function makeAnalyser(ctx, smoothing = 0.85) {
      const a = ctx.createAnalyser();
      a.fftSize = 2048;
      a.minDecibels = -90;
      a.maxDecibels = -20;
      a.smoothingTimeConstant = smoothing;
      return a;
    }

    function getAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        analyser = makeAnalyser(audioCtx);
      }
      if (audioCtx.state === "suspended") audioCtx.resume();
      return audioCtx;
    }

    // =====================================================================
    // State + UI helpers
    // =====================================================================
    const state = {
      recording: false,
      playing: false,
      exporting: false,
    };
    let clip = null;      // { blob, url, buffer, player, source }
    let size = { w: 1080, h: 1080, name: "Square" };
    let watermark = true;
    let msgTimer = null;

    function setMode() {
      app.classList.toggle("recording", state.recording);
      app.classList.toggle("playing", state.playing);
      app.classList.toggle("exporting", state.exporting);
      micBtn.setAttribute("aria-label", state.recording ? "Stop recording" : "Start recording");
      micBtn.disabled = state.exporting;
      uploadBtn.disabled = state.exporting || state.recording;
      playBtn.disabled = state.exporting;
      exportBtn.disabled = state.exporting;
      document.querySelectorAll(".chip").forEach((c) => (c.disabled = state.exporting));
      wmBtn.disabled = state.exporting;
    }

    function showMessage(text, { nudgeUpload = false, ms = 9000 } = {}) {
      msgEl.textContent = text;
      msgEl.hidden = false;
      clearTimeout(msgTimer);
      msgTimer = setTimeout(() => (msgEl.hidden = true), ms);
      if (nudgeUpload) {
        uploadBtn.classList.remove("nudge");
        void uploadBtn.offsetWidth;
        uploadBtn.classList.add("nudge");
      }
    }
    function hideMessage() { msgEl.hidden = true; }

    function fmt(sec) {
      sec = Math.max(0, Math.floor(sec));
      return Math.floor(sec / 60) + ":" + String(sec % 60).padStart(2, "0");
    }

    function showExportPanel() {
      if (!exportPanel.hidden) return;
      exportPanel.hidden = false;
      requestAnimationFrame(() => requestAnimationFrame(() => exportPanel.classList.remove("enter")));
    }

    // =====================================================================
    // Recording
    // =====================================================================
    let micStream = null, micSource = null, recorder = null, recChunks = [], recStart = 0, recCap = null;

    function pickType(types) {
      if (!window.MediaRecorder) return "";
      return types.find((t) => MediaRecorder.isTypeSupported(t)) || "";
    }

    async function startRecording() {
      hideMessage();
      pause();
      if (!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder) {
        showMessage("This browser can't record audio. Upload a voice file instead.", { nudgeUpload: true });
        return;
      }
      const ctx = getAudio();
      try {
        micStream = await navigator.mediaDevices.getUserMedia({
          audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
        });
      } catch (err) {
        const blocked = err && (err.name === "NotAllowedError" || err.name === "SecurityError");
        showMessage(
          blocked
            ? "Microphone access is blocked. Allow it in your browser's site settings, or upload a voice file instead."
            : "No microphone found. You can upload a voice file instead.",
          { nudgeUpload: true }
        );
        return;
      }

      micSource = ctx.createMediaStreamSource(micStream);
      micSource.connect(analyser); // analyser only: never to the speakers (feedback)

      const type = pickType(["audio/webm;codecs=opus", "audio/webm", "audio/mp4", "audio/ogg;codecs=opus"]);
      recorder = new MediaRecorder(micStream, type ? { mimeType: type } : undefined);
      recChunks = [];
      recorder.ondataavailable = (e) => e.data.size && recChunks.push(e.data);
      recorder.onstop = () => {
        const blob = new Blob(recChunks, { type: recorder.mimeType || type || "audio/webm" });
        if (blob.size) loadClip(blob, { autoplay: false });
      };
      recorder.start(100);
      recStart = performance.now();
      recCap = setTimeout(() => {
        stopRecording();
        showMessage("Recordings are capped at 60 seconds.", { ms: 4000 });
      }, MAX_SECONDS * 1000);
      state.recording = true;
      setMode();
    }

    function stopRecording() {
      if (!state.recording) return;
      clearTimeout(recCap);
      if (recorder && recorder.state !== "inactive") recorder.stop();
      micStream?.getTracks().forEach((t) => t.stop());
      micSource?.disconnect();
      micSource = null;
      micStream = null;
      state.recording = false;
      setMode();
    }

    micBtn.addEventListener("click", () => (state.recording ? stopRecording() : startRecording()));

    // =====================================================================
    // Upload
    // =====================================================================
    const AUDIO_EXT = /\.(mp3|wav|m4a|webm|mp4|aac|ogg)$/i;

    function handleFile(file) {
      if (!file) return;
      if (!file.type.startsWith("audio/") && !AUDIO_EXT.test(file.name)) {
        showMessage("That doesn't look like an audio file. Try mp3, wav, m4a or webm.");
        return;
      }
      hideMessage();
      loadClip(file, { autoplay: true });
    }

    uploadBtn.addEventListener("click", () => fileInput.click());
    fileInput.addEventListener("change", () => {
      handleFile(fileInput.files[0]);
      fileInput.value = "";
    });
    window.addEventListener("dragover", (e) => e.preventDefault());
    window.addEventListener("drop", (e) => {
      e.preventDefault();
      if (!state.recording && !state.exporting) handleFile(e.dataTransfer.files[0]);
    });

    // =====================================================================
    // Clip playback
    // =====================================================================
    async function loadClip(blob, { autoplay }) {
      const ctx = getAudio();
      let buffer;
      try {
        buffer = await ctx.decodeAudioData(await blob.arrayBuffer());
      } catch {
        showMessage("Couldn't read that audio. Try an mp3, wav, m4a or webm file.");
        return;
      }

      if (clip) {
        clip.player.pause();
        clip.source.disconnect();
        URL.revokeObjectURL(clip.url);
      }
      const url = URL.createObjectURL(blob);
      const player = new Audio(url);
      player.preload = "auto";
      const source = ctx.createMediaElementSource(player);
      source.connect(analyser);
      source.connect(ctx.destination);
      player.addEventListener("play", () => { state.playing = true; setMode(); });
      player.addEventListener("pause", () => { state.playing = false; setMode(); });
      player.addEventListener("ended", () => { state.playing = false; setMode(); });
      clip = { blob, url, buffer, player, source };

      showExportPanel();
      if (autoplay) play();
    }

    function play() {
      if (!clip || state.exporting) return;
      getAudio();
      if (clip.player.ended) clip.player.currentTime = 0;
      clip.player.play().catch(() => {});
    }
    function pause() { clip?.player.pause(); }

    playBtn.addEventListener("click", () => (state.playing ? pause() : play()));

    // =====================================================================
    // Export
    // =====================================================================
    function selectChip(chip) {
      document.querySelectorAll(".chip").forEach((c) => c.setAttribute("aria-checked", String(c === chip)));
      size = { w: +chip.dataset.w, h: +chip.dataset.h, name: chip.dataset.name };
      captionEl.textContent = `${size.name} · ${size.w}×${size.h}`;
    }
    document.querySelectorAll(".chip").forEach((chip) => {
      chip.addEventListener("click", () => selectChip(chip));
      chip.addEventListener("keydown", (e) => {
        const chips = [...document.querySelectorAll(".chip")];
        const dir = { ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1 }[e.key];
        if (!dir) return;
        e.preventDefault();
        const next = chips[(chips.indexOf(chip) + dir + chips.length) % chips.length];
        selectChip(next);
        next.focus();
      });
    });
    selectChip(document.querySelector(".chip"));

    wmBtn.addEventListener("click", () => {
      watermark = !watermark;
      wmBtn.setAttribute("aria-pressed", String(watermark));
    });

    // ---------- Video details (optional podcast layout) ----------
    const detailsSheet = $("#detailsSheet");
    const detailsForm = $("#detailsForm");
    const detailsPreview = $("#detailsPreview");
    const logoInput = $("#logoInput");
    const DETAIL_FIELDS = ["topic", "podcast", "person", "city", "country"];
    const details = { topic: "", podcast: "", person: "", city: "", country: "", logo: null, logoData: "" };
    const hasDetails = () => DETAIL_FIELDS.some((k) => details[k]) || !!details.logo;

    function saveDetails() {
      const data = Object.fromEntries(DETAIL_FIELDS.map((k) => [k, details[k]]));
      try {
        localStorage.setItem("vm-details", JSON.stringify({ ...data, logoData: details.logoData }));
      } catch {
        try { localStorage.setItem("vm-details", JSON.stringify(data)); } catch {} // logo too big to keep
      }
    }

    function setLogo(dataUrl) {
      details.logo = null;
      details.logoData = dataUrl || "";
      $("#logoThumb").hidden = !dataUrl;
      $("#logoClear").hidden = !dataUrl;
      $("#logoPickText").textContent = dataUrl ? "Change logo" : "Upload logo";
      if (!dataUrl) return;
      const img = new Image();
      img.onload = () => { if (details.logoData === dataUrl) details.logo = img; };
      img.src = dataUrl;
      $("#logoThumb").src = dataUrl;
    }

    DETAIL_FIELDS.forEach((k) => {
      detailsForm.elements[k].addEventListener("input", (e) => {
        details[k] = e.target.value.trim();
        saveDetails();
      });
    });
    $("#logoPick").addEventListener("click", () => logoInput.click());
    logoInput.addEventListener("change", () => {
      const file = logoInput.files[0];
      logoInput.value = "";
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => { setLogo(reader.result); saveDetails(); };
      reader.readAsDataURL(file);
    });
    $("#logoClear").addEventListener("click", () => { setLogo(""); saveDetails(); });
    $("#detailsClear").addEventListener("click", () => {
      DETAIL_FIELDS.forEach((k) => { details[k] = ""; detailsForm.elements[k].value = ""; });
      setLogo("");
      saveDetails();
    });

    try {
      const saved = JSON.parse(localStorage.getItem("vm-details")) || {};
      DETAIL_FIELDS.forEach((k) => {
        if (typeof saved[k] === "string") details[k] = detailsForm.elements[k].value = saved[k];
      });
      if (typeof saved.logoData === "string" && saved.logoData.startsWith("data:image/")) setLogo(saved.logoData);
    } catch {}

    // Live preview in the sheet, animated with a made-up voice so the rhythm moves
    const preview = { ctx: detailsPreview.getContext("2d"), vis: new Visual(), wave: null, tpl: null, freq: new Uint8Array(1024), t: 0 };
    function renderDetailsPreview(dt) {
      const p = preview;
      p.t += dt;
      for (let i = 0; i < p.freq.length; i++) {
        const v = 230 * Math.exp(-i / 150) * (0.55 + 0.45 * Math.sin(i * 0.07 + p.t * 3.1)) * (0.6 + 0.4 * Math.sin(p.t * 2.3 + i * 0.013));
        p.freq[i] = v;
      }
      const { width: w, height: h } = detailsPreview;
      if (hasDetails()) {
        drawTemplate(p.ctx, w, h, details, p.tpl, p.freq, dt, true, watermark);
      } else {
        p.vis.update(null, dt);
        p.vis.draw(p.ctx, w, h);
        drawWave(p.ctx, w, h, p.wave, p.freq, dt, true, 1);
        if (watermark) drawWatermark(p.ctx, w, h);
      }
    }

    let detailsReturnFocus = null;
    function openDetails() {
      if (!clip || state.exporting) return;
      pause();
      preview.wave ??= makeWave();
      preview.tpl ??= makeTemplateState();
      // preview at a third of the export size: sharp enough, cheap to draw
      detailsPreview.width = Math.round(size.w / 3);
      detailsPreview.height = Math.round(size.h / 3);
      detailsReturnFocus = document.activeElement;
      detailsSheet.hidden = false;
      detailsForm.focus();
    }
    function closeDetails() {
      detailsSheet.hidden = true;
      detailsReturnFocus?.focus?.();
    }
    detailsForm.addEventListener("submit", (e) => {
      e.preventDefault();
      closeDetails();
      exportVideo();
    });
    $("#detailsCancel").addEventListener("click", closeDetails);
    detailsSheet.addEventListener("pointerdown", (e) => { if (e.target === detailsSheet) closeDetails(); });
    detailsSheet.addEventListener("keydown", (e) => {
      if (e.key === "Escape") { e.stopPropagation(); closeDetails(); }
    });

    // ---------- Color configuration panel ----------
    const colorBtn = $("#colorBtn");
    const colorPanel = $("#colorPanel");
    const colorRows = BLOBS.map((_, i) => {
      const row = document.createElement("div");
      row.className = "color-row";
      row.innerHTML =
        `<label for="hex${i}">${BLOB_LABELS[i]}</label>` +
        `<input type="color" aria-label="${BLOB_LABELS[i]} color picker" />` +
        `<input type="text" class="hex" id="hex${i}" maxlength="7" spellcheck="false" autocomplete="off" />`;
      $("#colorRows").appendChild(row);
      const [picker, hex] = row.querySelectorAll("input");
      picker.addEventListener("input", () => applyColor(i, picker.value));
      hex.addEventListener("input", () => {
        const v = normalizeHex(hex.value);
        hex.setAttribute("aria-invalid", String(!v));
        if (v) applyColor(i, v, { keepText: true });
      });
      // tidy the text back to the last valid color when the field loses focus
      hex.addEventListener("blur", () => {
        hex.value = picker.value.toUpperCase();
        hex.setAttribute("aria-invalid", "false");
      });
      return { picker, hex };
    });

    function applyColor(i, hex, { keepText = false } = {}) {
      setBlobColor(i, hex);
      colorRows[i].picker.value = hex;
      if (!keepText) colorRows[i].hex.value = hex.toUpperCase();
      saveColors();
    }
    function applyPalette(colors) {
      colors.forEach((c, i) => applyColor(i, c));
    }

    PRESETS.forEach((p) => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "preset";
      b.title = p.name;
      b.setAttribute("aria-label", p.name + " preset");
      b.style.background = `linear-gradient(135deg, ${p.colors[0]}, ${p.colors[1]} 50%, ${p.colors[2]})`;
      b.addEventListener("click", () => applyPalette(p.colors));
      $("#presets").appendChild(b);
    });
    $("#resetColors").addEventListener("click", () => applyPalette(DEFAULT_COLORS));

    function saveColors() {
      try { localStorage.setItem("vm-colors", JSON.stringify(colorRows.map((r) => r.picker.value))); } catch {}
    }
    function loadColors() {
      try {
        const saved = JSON.parse(localStorage.getItem("vm-colors"));
        if (Array.isArray(saved) && saved.length === BLOBS.length && saved.every(normalizeHex)) return saved.map(normalizeHex);
      } catch {}
      return DEFAULT_COLORS;
    }
    applyPalette(loadColors());

    function setColorPanel(open) {
      colorBtn.setAttribute("aria-expanded", String(open));
      if (open) {
        colorPanel.hidden = false;
        requestAnimationFrame(() => requestAnimationFrame(() => colorPanel.classList.remove("enter")));
      } else {
        colorPanel.classList.add("enter");
        colorPanel.hidden = true;
      }
    }
    colorBtn.addEventListener("click", () => setColorPanel(colorPanel.hidden));
    document.addEventListener("pointerdown", (e) => {
      if (!colorPanel.hidden && !colorPanel.contains(e.target) && !colorBtn.contains(e.target)) setColorPanel(false);
    });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && !colorPanel.hidden) {
        setColorPanel(false);
        colorBtn.focus();
      }
    });

    function setProgress(p) {
      const v = Math.round(clamp(p) * 100);
      exportBtn.style.setProperty("--p", v);
      pctEl.textContent = "Exporting " + v + "%";
    }

    const MP4_TYPES = [
      'video/mp4;codecs="avc1.640028,mp4a.40.2"',
      'video/mp4;codecs="avc1.4D0028,mp4a.40.2"',
      'video/mp4;codecs="avc1.42E01E,mp4a.40.2"',
      "video/mp4;codecs=avc1,mp4a",
      "video/mp4",
    ];
    const WEBM_TYPES = ["video/webm;codecs=vp9,opus", "video/webm;codecs=vp8,opus", "video/webm"];

    let job = null; // the export currently rendering: { vis, an, canvas, ctx, w, h, watermark, wave, info, tpl, start, duration, share }

    function drawWatermark(ctx, w, h) {
      const fontSize = Math.round(Math.min(w, h) * 0.034);
      const pad = Math.round(Math.min(w, h) * 0.05);
      ctx.save();
      ctx.font = `600 ${fontSize}px "Google Sans", system-ui, sans-serif`;
      ctx.textAlign = "right";
      ctx.textBaseline = "alphabetic";
      ctx.fillStyle = "rgba(255, 255, 255, 0.72)";
      ctx.fillText("VoiceMotion", w - pad, h - pad);
      ctx.restore();
    }

    function renderJobFrame(dt) {
      job.vis.update(job.an, dt);
      if (job.info) {
        drawTemplate(job.ctx, job.w, job.h, job.info, job.tpl, job.vis.freq, dt, job.start != null, job.watermark);
      } else {
        job.vis.draw(job.ctx, job.w, job.h);
        drawWave(job.ctx, job.w, job.h, job.wave, job.vis.freq, dt, job.start != null, 1);
        if (job.watermark) drawWatermark(job.ctx, job.w, job.h);
      }
      if (job.start != null) {
        const p = (audioCtx.currentTime - job.start) / job.duration;
        setProgress(clamp(p) * job.share);
      }
    }

    async function exportVideo() {
      if (!clip || state.exporting) return;
      if (!window.MediaRecorder || !HTMLCanvasElement.prototype.captureStream) {
        showMessage("This browser can't export video. Try the latest Chrome, Edge or Safari.");
        return;
      }
      pause();
      hideMessage();
      state.exporting = true;
      setMode();
      setProgress(0);
      statusEl.textContent = "Rendering… keep this tab open";

      const ctx = getAudio();
      await ctx.resume();
      // podcast layout only when the user filled something in; otherwise the usual look
      const info = hasDetails() ? { ...details } : null;
      // wait for Google Sans so the text renders in the right font, but never block the export on it
      if (info) await Promise.race([document.fonts.load(`400 64px ${TPL_FONT}`).catch(() => {}), new Promise((r) => setTimeout(r, 1500))]);
      const { w, h } = size;
      const canvas = document.createElement("canvas");
      canvas.width = w;
      canvas.height = h;

      const mp4Type = pickType(MP4_TYPES);
      const mime = mp4Type || pickType(WEBM_TYPES);
      const src = ctx.createBufferSource();
      src.buffer = clip.buffer;
      const an = makeAnalyser(ctx, 0.6); // snappier than the on-screen analyser; the rhythm smooths it anyway
      const dest = ctx.createMediaStreamDestination();
      src.connect(an);
      src.connect(dest);

      job = {
        vis: new Visual(),
        an,
        canvas,
        ctx: canvas.getContext("2d"),
        w,
        h,
        watermark,
        wave: makeWave(),
        info,
        tpl: makeTemplateState(),
        start: null,
        duration: clip.buffer.duration,
        share: mp4Type ? 1 : 0.6, // leave room on the progress ring for MP4 conversion
      };
      job.vis.t = live.t;
      renderJobFrame(0);

      try {
        const stream = new MediaStream([
          ...canvas.captureStream(EXPORT_FPS).getVideoTracks(),
          ...dest.stream.getAudioTracks(),
        ]);
        const rec = new MediaRecorder(stream, {
          ...(mime ? { mimeType: mime } : {}),
          videoBitsPerSecond: w * h >= 1920 * 1080 ? 24_000_000 : 16_000_000, // sized for 60fps
          audioBitsPerSecond: 192_000,
        });
        const parts = [];
        rec.ondataavailable = (e) => e.data.size && parts.push(e.data);
        const stopped = new Promise((r) => (rec.onstop = r));
        const ended = new Promise((r) => (src.onended = r));

        rec.start(500);
        job.start = ctx.currentTime + 0.15;
        src.start(job.start);
        await ended;
        await new Promise((r) => setTimeout(r, 250));
        rec.stop();
        await stopped;
        stream.getTracks().forEach((t) => t.stop());
        src.disconnect();
        job = null;

        const recordedType = (rec.mimeType || mime || "video/webm").split(";")[0];
        let blob = new Blob(parts, { type: recordedType });
        let ext = recordedType.includes("mp4") ? "mp4" : "webm";

        if (ext !== "mp4") {
          statusEl.textContent = "Converting to MP4…";
          try {
            blob = await convertToMp4(blob, (p) => setProgress(0.6 + p * 0.4));
            ext = "mp4";
          } catch (err) {
            console.warn("MP4 conversion failed", err);
            showMessage("MP4 conversion isn't available here, so your video was saved as WebM instead.");
          }
        }

        setProgress(1);
        download(blob, `voicemotion-${w}x${h}.${ext}`);
        statusEl.textContent = "Done — check your downloads";
        setTimeout(() => { if (!state.exporting) statusEl.textContent = ""; }, 5000);
      } catch (err) {
        console.error(err);
        showMessage("Export failed. Please try again, or pick a smaller size.");
        statusEl.textContent = "";
      } finally {
        try { src.stop(); } catch {}
        job = null;
        state.exporting = false;
        setMode();
      }
    }

    function download(blob, name) {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = name;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 60_000);
    }

    // ffmpeg.wasm is only loaded when the browser can't record MP4 directly (e.g. Firefox).
    const FF = "https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/umd";
    const FF_UTIL = "https://cdn.jsdelivr.net/npm/@ffmpeg/util@0.12.1/dist/umd/index.js";
    const FF_CORE = "https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.6/dist/umd";
    let ffmpegReady = null;

    function loadScript(src) {
      return new Promise((resolve, reject) => {
        const s = document.createElement("script");
        s.src = src;
        s.onload = resolve;
        s.onerror = () => reject(new Error("Failed to load " + src));
        document.head.appendChild(s);
      });
    }

    function getFFmpeg() {
      ffmpegReady ??= (async () => {
        await Promise.all([loadScript(`${FF}/ffmpeg.js`), loadScript(FF_UTIL)]);
        const { FFmpeg } = window.FFmpegWASM;
        const { toBlobURL } = window.FFmpegUtil;
        const ff = new FFmpeg();
        await ff.load({
          classWorkerURL: await toBlobURL(`${FF}/814.ffmpeg.js`, "text/javascript"),
          coreURL: await toBlobURL(`${FF_CORE}/ffmpeg-core.js`, "text/javascript"),
          wasmURL: await toBlobURL(`${FF_CORE}/ffmpeg-core.wasm`, "application/wasm"),
        });
        return ff;
      })().catch((err) => { ffmpegReady = null; throw err; });
      return ffmpegReady;
    }

    async function convertToMp4(webm, onProgress) {
      const ff = await getFFmpeg();
      const onFF = ({ progress }) => onProgress(clamp(progress));
      ff.on("progress", onFF);
      try {
        await ff.writeFile("in.webm", new Uint8Array(await webm.arrayBuffer()));
        const code = await ff.exec([
          "-i", "in.webm",
          "-c:v", "libx264", "-preset", "ultrafast", "-crf", "18", "-pix_fmt", "yuv420p", "-r", String(EXPORT_FPS),
          "-c:a", "aac", "-b:a", "192k",
          "-movflags", "+faststart",
          "out.mp4",
        ]);
        if (code !== 0) throw new Error("ffmpeg exited with " + code);
        const data = await ff.readFile("out.mp4");
        return new Blob([data.buffer], { type: "video/mp4" });
      } finally {
        ff.off("progress", onFF);
        await ff.deleteFile("in.webm").catch(() => {});
        await ff.deleteFile("out.mp4").catch(() => {});
      }
    }

    exportBtn.addEventListener("click", openDetails);

    // =====================================================================
    // Audio-reactive ring around the mic button
    // =====================================================================
    const RING_BARS = 72;
    const ringVals = new Float32Array(RING_BARS);
    let ringAlpha = 0;

    // =====================================================================
    // Rhythm waveform: a field of thin vertical lines across the full width.
    // Pink/red glows upward, blue downward, meeting at a bright wavy baseline.
    // The spectrum is mirrored so low (loud) frequencies swell in the middle.
    // =====================================================================
    const WAVE_LINES = 320;
    const makeWave = () => ({ vals: new Float32Array(WAVE_LINES), raw: new Float32Array(WAVE_LINES), t: 0 });

    // `cy` is the baseline height and `scale` shrinks the wave (both optional).
    function drawWave(ctx, w, h, wave, freq, dt, active, alpha, { cy = h / 2, scale = 1 } = {}) {
      if (alpha < 0.01) return;
      const { vals, raw } = wave;
      wave.t += dt;
      const t = wave.t;
      const n = WAVE_LINES;

      // 1. target height per line from the spectrum, with a travelling ripple
      for (let j = 0; j < n; j++) {
        const x = j / (n - 1);
        const u = Math.abs(x * 2 - 1); // 0 in the centre, 1 at the edges
        let v = 0;
        if (active && freq) {
          const bin = 2 + Math.floor(Math.pow(u, 1.5) * freq.length * 0.4);
          v = clamp((freq[bin] / 255 - 0.12) / 0.75);
        }
        const ripple = 0.7 + 0.3 * Math.sin(x * 19 - t * 1.6) * Math.sin(x * 7 + t * 0.9);
        raw[j] = 0.03 + v * ripple * (0.35 + 0.65 * (1 - u * u));
      }
      // 2. blur along x so the envelope forms smooth hills
      for (let pass = 0; pass < 3; pass++) {
        let prev = raw[0];
        for (let j = 1; j < n - 1; j++) {
          const cur = raw[j];
          raw[j] = (prev + cur * 2 + raw[j + 1]) / 4;
          prev = cur;
        }
      }
      // 3. smooth over time: rise quickly, fall slowly
      for (let j = 0; j < n; j++) {
        vals[j] += (raw[j] - vals[j]) * (1 - Math.pow(raw[j] > vals[j] ? 0.5 : 0.84, dt * 60));
      }

      const S = Math.min(h, w * 1.1) * scale;
      const gap = w / n;
      const baseY = (j) => {
        const x = j / (n - 1);
        return cy + Math.sin(x * 9 + t * 0.7) * S * 0.012 + Math.sin(x * 23 - t * 1.1) * S * 0.005 - vals[j] * S * 0.03;
      };

      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.globalCompositeOperation = "lighter";
      ctx.lineCap = "butt";
      ctx.lineWidth = Math.max(1.5, gap * 0.5);
      const pal = rhythmPalette();
      // Lines are grouped by height so each group shares one gradient and one
      // stroke: ~24 draw calls a frame instead of 640, which keeps exports smooth.
      const B = 12;
      const upPaths = [], downPaths = [];
      for (let b = 0; b < B; b++) { upPaths.push(new Path2D()); downPaths.push(new Path2D()); }
      for (let j = 0; j < n; j++) {
        const x = (j + 0.5) * gap;
        const y0 = baseY(j);
        const v = Math.min(1, vals[j]);
        const b = Math.min(B - 1, Math.floor(v * B));
        upPaths[b].moveTo(x, y0);
        upPaths[b].lineTo(x, y0 - S * (0.02 + v * 0.4));
        downPaths[b].moveTo(x, y0);
        downPaths[b].lineTo(x, y0 + S * (0.03 + v * 0.18));
      }
      for (let b = 0; b < B; b++) {
        const v = (b + 0.5) / B; // the group's typical height
        const y0 = cy - v * S * 0.03;
        const gu = ctx.createLinearGradient(0, y0, 0, y0 - S * (0.02 + v * 0.4));
        gu.addColorStop(0, pal.upCore);
        gu.addColorStop(0.15, pal.upMid);
        gu.addColorStop(0.55, pal.upDeep);
        gu.addColorStop(1, pal.upTip);
        ctx.strokeStyle = gu;
        ctx.stroke(upPaths[b]);

        const gd = ctx.createLinearGradient(0, y0, 0, y0 + S * (0.03 + v * 0.18));
        gd.addColorStop(0, pal.downCore);
        gd.addColorStop(0.3, pal.downMid);
        gd.addColorStop(1, pal.downEnd);
        ctx.strokeStyle = gd;
        ctx.stroke(downPaths[b]);
      }

      // glowing core along the baseline: a few wide, faint strokes instead of
      // shadowBlur, which is very slow on large canvases
      const core = new Path2D();
      for (let j = 0; j < n; j++) {
        const x = (j + 0.5) * gap;
        j ? core.lineTo(x, baseY(j)) : core.moveTo(x, baseY(j));
      }
      ctx.lineJoin = "round";
      ctx.strokeStyle = pal.glow;
      for (const [width, a] of [[0.07, 0.05], [0.04, 0.09], [0.018, 0.18]]) {
        ctx.globalAlpha = alpha * a;
        ctx.lineWidth = S * width;
        ctx.stroke(core);
      }
      ctx.restore();
    }

    // =====================================================================
    // Podcast layout, used for the export when video details are filled in.
    // Black frame; podcast + host top-left, city + country top-right; a band of
    // glowing magenta columns driven by the audio; a big headline; podcaster
    // logo bottom-left and the VoiceMotion logo bottom-right. Positions are
    // fractions of the frame, measured from the 1:1, 4:5, 9:16 and 16:9 designs.
    // =====================================================================
    const TPL_COLS = 24;
    const TPL_FONT = '"Google Sans", system-ui, sans-serif';
    const makeTemplateState = () => ({ cols: new Float32Array(TPL_COLS).fill(0.1), raw: new Float32Array(TPL_COLS), glow: null, pattern: null, head: null });

    function templateLayout(w, h) {
      const r = w / h;
      if (r > 1.3) { // 16:9 — rhythm on the right, headline bottom-left
        return { locX: 0.52 * w, band: [0.43 * w, 0.94 * w, 0.18 * h, 0.76 * h], head: { size: 0.105 * h, x: 0.03 * w, base: 0.78 * h, maxW: 0.55 * w }, footY: 0.925 * h };
      }
      if (r < 0.7) { // 9:16 — headline sits below the rhythm
        return { locX: 0.53 * w, band: [0, w, 0.23 * h, 0.59 * h], head: { size: 0.105 * w, x: 0.037 * w, base: 0.76 * h, maxW: 0.9 * w }, footY: 0.94 * h };
      }
      if (r < 0.9) { // 4:5
        return { locX: 0.73 * w, band: [0, w, 0.17 * h, 0.83 * h], head: { size: 0.1 * w, x: 0.083 * w, base: 0.77 * h, maxW: 0.84 * w }, footY: 0.93 * h };
      }
      // 1:1
      return { locX: 0.58 * w, band: [0, w, 0.17 * h, 0.8 * h], head: { size: 0.098 * w, x: 0.059 * w, base: 0.785 * h, maxW: 0.88 * w }, footY: 0.92 * h };
    }

    function wrapLines(ctx, text, maxW) {
      const lines = [];
      let line = "";
      for (const word of text.split(/\s+/).filter(Boolean)) {
        const test = line ? line + " " + word : word;
        if (line && ctx.measureText(test).width > maxW) { lines.push(line); line = word; }
        else line = test;
      }
      if (line) lines.push(line);
      return lines;
    }
    function ellipsize(ctx, text, maxW) {
      if (ctx.measureText(text).width <= maxW) return text;
      while (text && ctx.measureText(text + "…").width > maxW) text = text.slice(0, -1);
      return text + "…";
    }

    // The VoiceMotion logo as an image for the canvas. The SVG only has a
    // viewBox, so give it a size first or some browsers won't draw it.
    const vmLogo = new Image();
    fetch("white-voice-motion.svg")
      .then((r) => r.text())
      .then((svg) => {
        const vb = svg.match(/viewBox="[\d.]+ [\d.]+ ([\d.]+) ([\d.]+)"/);
        if (vb) svg = svg.replace("<svg ", `<svg width="${vb[1]}" height="${vb[2]}" `);
        vmLogo.src = URL.createObjectURL(new Blob([svg], { type: "image/svg+xml" }));
      })
      .catch(() => {});

    function drawTemplate(ctx, w, h, info, st, freq, dt, active, showWatermark) {
      const L = templateLayout(w, h);
      const u = Math.min(w, h);
      const [bx0, bx1, by0, by1] = L.band;
      const bw = bx1 - bx0, bh = by1 - by0, cy = (by0 + by1) / 2;
      const colW = bw / TPL_COLS;
      const band = rhythmPalette().band; // "r, g, b" from the Glow color

      // column levels from the spectrum, mirrored so low (loud) frequencies sit in the middle
      for (let j = 0; j < TPL_COLS; j++) {
        const k = Math.abs((j / (TPL_COLS - 1)) * 2 - 1);
        let v = 0;
        if (active && freq) {
          const bin = 2 + Math.floor(Math.pow(k, 1.4) * freq.length * 0.35);
          v = clamp((freq[bin] / 255 - 0.1) / 0.75);
        }
        st.raw[j] = 0.1 + 0.9 * v * (0.45 + 0.55 * (1 - k * k));
      }
      // blend neighbours so the glow swells as one wide shape, like the design
      for (let pass = 0; pass < 2; pass++) {
        let prev = st.raw[0];
        for (let j = 1; j < TPL_COLS - 1; j++) {
          const cur = st.raw[j];
          st.raw[j] = (prev + cur * 2 + st.raw[j + 1]) / 4;
          prev = cur;
        }
      }
      for (let j = 0; j < TPL_COLS; j++) {
        const target = Math.min(1, st.raw[j] * 1.25);
        st.cols[j] += (target - st.cols[j]) * (1 - Math.pow(target > st.cols[j] ? 0.45 : 0.8, dt * 60));
      }

      ctx.save();
      ctx.fillStyle = "#060606";
      ctx.fillRect(0, 0, w, h);

      // --- rhythm band ---
      ctx.save();
      ctx.beginPath();
      ctx.rect(bx0, by0, bw, bh);
      ctx.clip();

      // soft glow: one pixel per column in a tiny canvas, upscaled so it blurs
      if (!st.glow) {
        st.glow = document.createElement("canvas");
        st.glow.width = TPL_COLS;
        st.glow.height = 48;
      }
      const g = st.glow.getContext("2d");
      g.clearRect(0, 0, TPL_COLS, 48);
      for (let j = 0; j < TPL_COLS; j++) {
        const lv = st.cols[j];
        const hh = 24 * (0.3 + 0.7 * lv);
        const grad = g.createLinearGradient(0, 24 - hh, 0, 24 + hh);
        grad.addColorStop(0, `rgba(${band}, 0)`);
        grad.addColorStop(0.5, `rgba(${band}, ${Math.min(1, 0.15 + 1.1 * lv)})`);
        grad.addColorStop(1, `rgba(${band}, 0)`);
        g.fillStyle = grad;
        g.fillRect(j, 0, 1, 48);
      }
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = "high";
      ctx.drawImage(st.glow, bx0 - colW / 2, by0, bw + colW, bh);

      // crisp columns on top, so each stripe reads as its own step
      for (let j = 0; j < TPL_COLS; j++) {
        const lv = st.cols[j];
        const hh = (bh / 2) * (0.25 + 0.75 * lv);
        const grad = ctx.createLinearGradient(0, cy - hh, 0, cy + hh);
        grad.addColorStop(0, `rgba(${band}, 0)`);
        grad.addColorStop(0.5, `rgba(${band}, ${0.8 * lv})`);
        grad.addColorStop(1, `rgba(${band}, 0)`);
        ctx.fillStyle = grad;
        ctx.fillRect(bx0 + j * colW, cy - hh, colW, hh * 2);
      }

      // thin stripe lines between the columns
      const lineGrad = ctx.createLinearGradient(0, by0, 0, by1);
      lineGrad.addColorStop(0, `rgba(${band}, 0.16)`);
      lineGrad.addColorStop(0.5, `rgba(${band}, 0.38)`);
      lineGrad.addColorStop(1, `rgba(${band}, 0.16)`);
      ctx.strokeStyle = lineGrad;
      ctx.lineWidth = Math.max(1, u * 0.0024);
      ctx.beginPath();
      for (let j = 0; j <= TPL_COLS; j++) {
        const x = bx0 + j * colW + colW / 2;
        if (x >= bx1) break;
        ctx.moveTo(x, by0);
        ctx.lineTo(x, by1);
      }
      ctx.stroke();

      // moving film grain; "overlay" only textures the glow, so black stays black
      if (!st.pattern) st.pattern = ctx.createPattern(grain, "repeat");
      st.pattern.setTransform?.(new DOMMatrix().translate((Math.random() * 192) | 0, (Math.random() * 192) | 0));
      ctx.globalCompositeOperation = "overlay";
      ctx.globalAlpha = 0.25;
      ctx.fillStyle = st.pattern;
      ctx.fillRect(bx0, by0, bw, bh);
      ctx.restore();

      // --- top text: podcast + host on the left, city + country on the right ---
      const fs = u * 0.019;
      const pad = u * 0.035;
      ctx.font = `400 ${fs}px ${TPL_FONT}`;
      ctx.fillStyle = "rgba(255, 255, 255, 0.92)";
      ctx.textBaseline = "alphabetic";
      const top = pad + fs;
      const drawCol = (lines, x, maxW) => {
        lines.filter(Boolean).forEach((t, i) => ctx.fillText(ellipsize(ctx, t, maxW), x, top + i * fs * 1.3));
      };
      drawCol([info.podcast, info.person], pad, L.locX - pad - u * 0.03);
      drawCol([info.city, info.country], L.locX, w - L.locX - pad);

      // --- headline, bottom-aligned so longer topics grow upward ---
      if (info.topic) {
        const key = `${info.topic}|${w}x${h}`;
        if (!st.head || st.head.key !== key) {
          let size = L.head.size, lines;
          for (;;) {
            ctx.font = `400 ${size}px ${TPL_FONT}`;
            lines = wrapLines(ctx, info.topic, L.head.maxW);
            const fits = lines.length <= 3 && lines.every((l) => ctx.measureText(l).width <= L.head.maxW);
            if (fits || size < L.head.size * 0.45) break;
            size *= 0.9;
          }
          st.head = { key, size, lines };
        }
        const { size, lines } = st.head;
        ctx.font = `400 ${size}px ${TPL_FONT}`;
        ctx.fillStyle = "#ffffff";
        lines.forEach((l, i) => ctx.fillText(l, L.head.x, L.head.base - (lines.length - 1 - i) * size * 1.12));
      }

      // --- footer: podcaster logo left, VoiceMotion logo right ---
      if (info.logo?.naturalWidth) {
        const maxH = u * 0.065, maxW = u * 0.28;
        const s = Math.min(maxH / info.logo.naturalHeight, maxW / info.logo.naturalWidth);
        const lw = info.logo.naturalWidth * s, lh = info.logo.naturalHeight * s;
        ctx.drawImage(info.logo, L.head.x, L.footY - lh / 2, lw, lh);
      }
      if (showWatermark && vmLogo.naturalWidth) {
        const lh = u * 0.052;
        const lw = lh * (vmLogo.naturalWidth / vmLogo.naturalHeight);
        ctx.globalAlpha = 0.55;
        ctx.drawImage(vmLogo, w - u * 0.06 - lw, L.footY - lh / 2, lw, lh);
      }
      ctx.restore();
    }

    // Radial frequency bars around the mic button.
    // `vals` holds each bar's smoothed height between frames.
    function drawBars(ctx, { cx, cy, inner, maxLen, lineWidth, freq, vals, alpha, dt, active }) {
      const half = RING_BARS / 2;
      ctx.save();
      ctx.lineCap = "round";
      ctx.lineWidth = lineWidth;
      ctx.strokeStyle = `rgba(255, 255, 255, ${0.85 * alpha})`;
      ctx.beginPath();
      for (let i = 0; i < RING_BARS; i++) {
        // mirror so the ring is symmetric; low frequencies at the top
        const k = i < half ? i : RING_BARS - 1 - i;
        let target = 0;
        if (active && freq) {
          const bin = 2 + Math.floor(Math.pow(k / half, 1.7) * freq.length * 0.35);
          target = clamp((freq[bin] / 255 - 0.15) / 0.7);
        }
        vals[i] += (target - vals[i]) * (1 - Math.pow(target > vals[i] ? 0.6 : 0.88, dt * 60));
        const len = maxLen * (0.06 + vals[i]);
        const ang = (i / RING_BARS) * Math.PI * 2 - Math.PI / 2;
        const cos = Math.cos(ang), sin = Math.sin(ang);
        ctx.moveTo(cx + cos * inner, cy + sin * inner);
        ctx.lineTo(cx + cos * (inner + len), cy + sin * (inner + len));
      }
      ctx.stroke();
      ctx.restore();
    }

    function drawRing(dt, active) {
      const w = ring.width, h = ring.height;
      ringCtx.clearRect(0, 0, w, h);
      ringAlpha += ((active ? 1 : 0) - ringAlpha) * (1 - Math.pow(0.9, dt * 60));
      if (ringAlpha < 0.01) return;
      drawBars(ringCtx, {
        cx: w / 2,
        cy: h / 2,
        inner: w / 2 / 2.4 + w * 0.035, // button radius + gap
        maxLen: w * 0.13,
        lineWidth: Math.max(2, w * 0.012),
        freq: live.freq,
        vals: ringVals,
        alpha: ringAlpha,
        dt,
        active,
      });
    }

    // =====================================================================
    // Main loop
    // =====================================================================
    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      bg.width = Math.round(innerWidth * dpr);
      bg.height = Math.round(innerHeight * dpr);
      ring.width = Math.round(ring.clientWidth * dpr);
      ring.height = Math.round(ring.clientHeight * dpr);
    }
    window.addEventListener("resize", resize);
    resize();

    function updateTimer() {
      let text = "";
      if (state.recording) {
        text = `${fmt((performance.now() - recStart) / 1000)} / ${fmt(MAX_SECONDS)}`;
      } else if (clip) {
        const d = clip.buffer.duration;
        text = state.playing || clip.player.currentTime > 0 && !clip.player.ended
          ? `${fmt(clip.player.currentTime)} / ${fmt(d)}`
          : fmt(d);
      }
      if (timerEl.textContent !== text) timerEl.textContent = text;
    }

    // Keep the phone's status/browser bar the same color as the top of the
    // gradient: average the canvas's top row a few times a second and use it
    // for theme-color and the page background (Safari tints from both).
    const themeMeta = document.querySelector('meta[name="theme-color"]');
    let themeTimer = 0, themeColor = "";
    function syncThemeColor(dt) {
      themeTimer -= dt;
      if (themeTimer > 0 || !bg.width) return;
      themeTimer = 0.3;
      const d = bgCtx.getImageData(0, 0, bg.width, 1).data;
      let r = 0, g = 0, b = 0, n = 0;
      for (let i = 0; i < d.length; i += 16) { r += d[i]; g += d[i + 1]; b += d[i + 2]; n++; }
      const c = "#" + [r, g, b].map((v) => Math.round(v / n).toString(16).padStart(2, "0")).join("");
      if (c === themeColor) return;
      themeColor = c;
      themeMeta.content = c;
      document.documentElement.style.background = c;
      document.body.style.background = c;
    }

    const liveWave = makeWave();
    let waveAlpha = 0;
    let raf = null, last = 0, exportClock = 0, liveSkip = 0;
    function frame(now) {
      const dt = Math.min(0.1, (now - last) / 1000 || 0);
      last = now;
      const active = state.recording || state.playing;
      live.update(active ? analyser : null, dt);
      // While exporting, the video gets the frame budget: the page background
      // redraws every other frame and skips the colour sampling (a GPU readback
      // that would cause periodic hitches in the recording).
      if (!job || ++liveSkip % 2 === 0) live.draw(bgCtx, bg.width, bg.height);
      if (!job) syncThemeColor(dt);
      // preview shows the same rhythm waveform the export will contain
      waveAlpha += ((state.playing ? 1 : 0) - waveAlpha) * (1 - Math.pow(0.9, dt * 60));
      // on screen the wave sits low, just below the Upload button, so it clears the mic
      if (waveAlpha > 0.01) {
        const r = uploadBtn.getBoundingClientRect();
        const k = bg.height / innerHeight;
        const cy = Math.min(bg.height * 0.92, (r.bottom + innerHeight * 0.1) * k);
        drawWave(bgCtx, bg.width, bg.height, liveWave, live.freq, dt, state.playing, waveAlpha, { cy, scale: 0.55 });
      }
      drawRing(dt, active);
      if (job) {
        // draw export frames at EXPORT_FPS, even on 120 Hz screens
        exportClock += dt;
        if (exportClock >= 1 / EXPORT_FPS - 0.002) {
          renderJobFrame(exportClock);
          exportClock = 0;
        }
      }
      if (!detailsSheet.hidden) renderDetailsPreview(dt);
      updateTimer();
      raf = requestAnimationFrame(frame);
    }

    function startLoop() {
      if (raf) return;
      last = performance.now();
      raf = requestAnimationFrame(frame);
    }
    function stopLoop() {
      cancelAnimationFrame(raf);
      raf = null;
    }

    // Pause the animation when the tab is hidden to save battery.
    document.addEventListener("visibilitychange", () => (document.hidden ? stopLoop() : startLoop()));
    setMode();
    startLoop();
  </script>
</body>
</html>
